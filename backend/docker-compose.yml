services:
  db:
    image: postgres:16-alpine
    # Start the database again by itself after Docker Desktop or the laptop
    # restarts (otherwise the backend can't start because this
    # container has stopped).
    restart: unless-stopped
    volumes:
      - leo_pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: leo_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: leo_db

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://leo_user:${DB_PASSWORD}@db:5432/leo_db
      ENVIRONMENT: development
      SECRET_KEY: ${SECRET_KEY}
      CORS_ALLOWED_ORIGINS: '["http://localhost:8080"]'
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  leo_pg_data: